name: Rust

on:
  - push
  - pull_request

env:
  CARGO_TERM_COLOR: always

# bao-tree is a git dep (Cargo.toml: n0-computer/bao-tree branch keyed-bao).
# Checkout it *inside* GITHUB_WORKSPACE (`path: bao-tree`). actions/checkout
# rejects anything outside the workspace, so `path: ../bao-tree` fails before rustc.
# After checkout, append a CI-only [patch] so cargo uses that tree (do not commit
# a machine-local path). Local optional sibling remains `just setup-bao-tree`.

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout bao-tree keyed fork (in-workspace for path dep)
        uses: actions/checkout@v4
        with:
          repository: n0-computer/bao-tree
          ref: keyed-bao
          path: bao-tree
          persist-credentials: false

      - name: Patch cargo to use workspace bao-tree
        uses: ./.github/actions/ci-patch-bao-tree

      - uses: extractions/setup-just@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: just fmt

      - name: Lint (native; backend-rust + optional features, never --all-features)
        run: just lint

  lint-wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout bao-tree keyed fork (in-workspace for path dep)
        uses: actions/checkout@v4
        with:
          repository: n0-computer/bao-tree
          ref: keyed-bao
          path: bao-tree
          persist-credentials: false

      - name: Patch cargo to use workspace bao-tree
        uses: ./.github/actions/ci-patch-bao-tree

      - uses: extractions/setup-just@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Lint (wasm32, no pqc)
        run: just lint-wasm

  desktop:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Checkout bao-tree keyed fork (in-workspace for path dep)
        uses: actions/checkout@v4
        with:
          repository: n0-computer/bao-tree
          ref: keyed-bao
          path: bao-tree
          persist-credentials: false

      - name: Patch cargo to use workspace bao-tree
        uses: ./.github/actions/ci-patch-bao-tree

      - uses: extractions/setup-just@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test (default features, includes parallel)
        run: cargo test
        env:
          RUST_BACKTRACE: 1

      - name: Test (serial FEC path without parallel)
        # Mutual exclusion: must name backend-rust under --no-default-features.
        run: cargo test --no-default-features --features "backend-rust,pqc,ots,cli" --test serial_fec_path
        env:
          RUST_BACKTRACE: 1

      - name: Test (backend-rust + optional features; never --all-features)
        # --all-features enables both backend-rust and backend-lean → compile_error!.
        run: cargo test --features "async,async-tokio,man-gen"
        env:
          RUST_BACKTRACE: 1

      - name: Test smoke (slices, streaming, sharding, bao contract)
        run: just test-smoke

      - name: Build carbonado (release)
        run: just build

      - name: CLI integration tests (release)
        run: just test-cli

      - name: Examples compile
        run: just examples

  # Full `cargo test` on musl, aarch64, and wasm32 is intentionally check-only
  # (expensive / limited runtime); native desktop job runs the full test suite.
  test-matrix:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - wasm32-unknown-unknown

    steps:
      - uses: actions/checkout@v4

      - name: Checkout bao-tree keyed fork (in-workspace for path dep)
        uses: actions/checkout@v4
        with:
          repository: n0-computer/bao-tree
          ref: keyed-bao
          path: bao-tree
          persist-credentials: false

      - name: Patch cargo to use workspace bao-tree
        uses: ./.github/actions/ci-patch-bao-tree

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Check ${{ matrix.target }} (backend-rust + pqc/optional; never --all-features)
        # --all-features enables both backends → compile_error!.
        run: cargo check --target ${{ matrix.target }} --features "async,async-tokio,man-gen"

      - name: Check ${{ matrix.target }} (backend-rust only, no pqc)
        run: cargo check --target ${{ matrix.target }} --no-default-features --features "backend-rust"

  # WASM browser testing is limited because libbitcoinpqc uses C code + cmake.
  # Full wasm-pack test can be run locally with:
  #   RUSTFLAGS="--cfg getrandom_backend=\"wasm_js\"" wasm-pack test --headless --chrome
  web-check:
    runs-on: ubuntu-latest
    needs: lint-wasm

    steps:
      - uses: actions/checkout@v4

      - name: Checkout bao-tree keyed fork (in-workspace for path dep)
        uses: actions/checkout@v4
        with:
          repository: n0-computer/bao-tree
          ref: keyed-bao
          path: bao-tree
          persist-credentials: false

      - name: Patch cargo to use workspace bao-tree
        uses: ./.github/actions/ci-patch-bao-tree

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Check wasm32 (backend-rust only, no pqc)
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features "backend-rust"

  # Dual-backend Phase 5 / G11 + R7 G8 full close: Linux lean full dual suite freeze.
  # Normative command: `just test-lean-ci` = unfiltered cargo test under lean features
  # (builds libcarbonado via nix if needed; fail-closed if .so missing).
  # backend-rust full suite remains the `desktop` job above — never regress.
  dual-backend-lean:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Checkout bao-tree keyed fork (in-workspace for path dep)
        uses: actions/checkout@v4
        with:
          repository: n0-computer/bao-tree
          ref: keyed-bao
          path: bao-tree
          persist-credentials: false

      - name: Patch cargo to use workspace bao-tree
        uses: ./.github/actions/ci-patch-bao-tree

      - uses: extractions/setup-just@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Free disk for nix + cargo
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build libcarbonado (Lean AOT)
        run: nix build .#libcarbonado -o result-libcarbonado

      - name: Fail-closed if libcarbonado missing
        run: |
          set -euo pipefail
          test -f result-libcarbonado/lib/libcarbonado.so
          test -d result-libcarbonado/include
          ls -la result-libcarbonado/lib/
          ls -la result-libcarbonado/include/

      - name: Dual-backend lean freeze matrix (just test-lean-ci)
        run: just test-lean-ci
        env:
          RUST_BACKTRACE: 1
          CARBONADO_LEAN_LIB: ${{ github.workspace }}/result-libcarbonado/lib
          CARBONADO_LEAN_INCLUDE: ${{ github.workspace }}/result-libcarbonado/include
          LD_LIBRARY_PATH: ${{ github.workspace }}/result-libcarbonado/lib
